name: CI

on:
  pull_request:
  workflow_dispatch:

# Nothing here writes. Publishing lives in release.yml, which is the only workflow npm
# will accept an OIDC token from.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Build first: it renders the skills into template/, which the drift check then
      # compares against the committed adapter trees.
      - run: npm run build

      - run: npm test

  # The oldest Node the package promises. Kept as its own job rather than a matrix so the
  # required check keeps the name "verify".
  verify-node-22:
    name: verify on Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test
