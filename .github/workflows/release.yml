name: Release

# This filename is registered with npm as the trusted publisher. Renaming the file revokes
# the package's ability to publish until the registration is updated to match.
on:
  push:
    branches: [main]

# One release at a time. Two concurrent runs would race the version PR against the tag push.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # commit the version bump, push tags, create the GitHub release
  pull-requests: write # open and update the version PR
  id-token: write # mint the OIDC token npm exchanges for publish rights

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changesets reads history to work out what changed

      # v7 is required, not merely current: earlier versions paired registry-url with a
      # dummy NODE_AUTH_TOKEN export, which left an empty _authToken in .npmrc. npm read
      # that as "already authenticated", skipped the OIDC exchange, and failed the publish.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1, and whatever npm a Node image bundles is
      # incidental. Pinned to a major so a future npm cannot change publishing behaviour on
      # its own; raising it is a deliberate edit.
      - run: npm install -g npm@^12.0.0

      - run: npm ci

      - run: npm run build

      - run: npm test

      # With changesets pending, this opens or updates the version PR and stops. With none
      # pending - which is the state right after that PR merges - it runs publish-script.
      - uses: changesets/action@v2
        with:
          publish-script: npm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # A PR opened with the default token does not trigger workflows, so the version PR
          # would never get the check that main requires. RELEASE_TOKEN gives it one. Without
          # the secret this still works; that single PR just has to be merged past the check.
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
